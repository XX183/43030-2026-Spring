name: HTML and README Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    if: github.actor == 'XX183'

    env:
      AUTHOR: ${{ github.actor }}

    steps:
      # Activity 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Activity 2: Update HTML
      - name: Update index.html
        run: |
          timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          sed -i "/<\/body>/i <p>Updated by ${AUTHOR} on ${timestamp}</p>" index.html

      # Activity 3: Update README
      - name: Update README
        run: |
          timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          commit_id=$(git rev-parse --short HEAD)
          printf '\n### Updated by %s on %s [Commit: %s]\n' \
            "$AUTHOR" "$timestamp" "$commit_id" >> README.md

      # Activity 4: Commit and push the changes
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Workflow: Update HTML and README for ${AUTHOR}"
          git push origin main