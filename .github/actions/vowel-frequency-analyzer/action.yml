name: Vowel Frequency Analyzer
description: Analyze vowel frequency with Docker and update README.

inputs:
  file:
    description: Path to the text file to analyze.
    required: true

runs:
  using: docker
  image: docker://ghcr.io/xx183/vowel-frequency-analyzer:latest
  entrypoint: /bin/bash
  args:
    - .github/scripts/entrypoint.sh
  env:
    FILE: ${{ inputs.file }}